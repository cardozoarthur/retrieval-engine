[package]
name = "retrieval-engine"
version = "0.1.0"
edition = "2021"
default-run = "retrieval-engine"
description = "Independent on-demand evidence retrieval engine"
license = "MIT"

[features]
cpu-onnx = ["dep:ort", "dep:tokenizers"]
sqlite-store = ["dep:rusqlite"]

[dependencies]
encoding_rs = "=0.8.44"
pdf-extract = "=0.12.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
scraper = { version = "=0.29.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
unicode-normalization = "=0.1.26"
ort = { version = "=2.0.0-rc.10", optional = true, default-features = false, features = ["load-dynamic"] }
tokenizers = { version = "=0.22.2", optional = true, default-features = false, features = ["fancy-regex"] }
rusqlite = { version = "=0.37.0", optional = true, features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Memory"] }

[[bin]]
name = "retrieval-engine"
path = "src/main.rs"

[[bin]]
name = "retrieval-embeddings"
path = "src/bin/embeddings.rs"
required-features = ["cpu-onnx"]

[[bin]]
name = "retrieval-worker"
path = "src/bin/retrieval.rs"

[[example]]
name = "e5_qualification"
required-features = ["cpu-onnx"]

[[example]]
name = "hybrid_qualification"
required-features = ["cpu-onnx"]

[[example]]
name = "benchmark_model_probe"
required-features = ["cpu-onnx"]

[[example]]
name = "retrieval_benchmark"
required-features = ["cpu-onnx"]

[[example]]
name = "rust_consumer"
required-features = ["sqlite-store"]

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.dev.package.sha2]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3
